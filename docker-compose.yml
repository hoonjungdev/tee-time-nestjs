services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: teetime
      POSTGRES_PASSWORD: teetime
      POSTGRES_DB: teetime
    ports:
      - '30772:5432'
    command:
      # 부하 상황에서 psql조차 붙지 못하는 일을 막는다. 애플리케이션 풀보다 여유를 둔다.
      - postgres
      - -c
      - max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teetime -d teetime']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
